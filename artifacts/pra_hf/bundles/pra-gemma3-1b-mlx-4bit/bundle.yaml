  limitations:
  - The learned router improves QASPER but is not uniformly positive on HotpotQA;
    it is opt-in rather than the bundle default.
  - Paired natural-QA evidence contains five examples per dataset and supports engine
    qualification, not production qualification.
  - Reduced consumer-layer configurations failed the held-out quality gate; BALANCED
    therefore retains all eligible layers.
  - The qualification identity is the exact 4-bit MLX model and revision; it does
    not transfer automatically to full-precision Hugging Face weights or another quantization.
  - Base-model and dataset licenses apply separately to the router artifact.
