  limitations:
  - The learned router improves QASPER but is not uniformly positive on HotpotQA;
    it is opt-in rather than the bundle default.
  - The held-out routing diagnostic contains 16 examples per dataset and supports
    controlled routing claims only.
  - Native consumer-layer profiles and end-task generation remain uncalibrated for
    this exact identity.
  - The qualification identity is the exact bfloat16 HF model and revision; it does
    not transfer automatically to another checkpoint, engine, or quantization.
  - Routing evidence compares a frozen generic router with a small learned router;
    it does not establish end-task generation quality.
  - Base-model and dataset licenses apply separately to the router artifact.
