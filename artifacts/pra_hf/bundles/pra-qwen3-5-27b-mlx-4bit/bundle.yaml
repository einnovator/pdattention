  limitations:
  - The learned router improves QASPER but is not uniformly positive on HotpotQA;
    it is opt-in rather than the bundle default.
  - The held-out routing diagnostic contains 16 examples per dataset and supports
    controlled routing claims only.
  - Detached Native Memory is unavailable for this hybrid recurrent/attention topology;
    the bundle fails closed to Selected Context.
  - The qualification identity is the exact 4bit MLX model and revision; it does not
    transfer automatically to another checkpoint, engine, or quantization.
  - The controlled end-task arm contains 16 examples per dataset; routing and generation
    claims remain dataset-specific.
  - Qwen3.5 interleaves 48 Gated DeltaNet layers with 16 full-attention layers. Selected
    Context and routing are supported, but detached Native Memory is unavailable until
    recurrent DeltaNet state has an explicit lifecycle and composition contract.
  - Base-model and dataset licenses apply separately to the router artifact.
