site_name: Progressive Retrieval Attention
site_description: Engineering manual for PRA context selection, typed transport, native memory, and serving
site_url: https://einnovator.github.io/pdattention/
use_directory_urls: false
repo_url: https://github.com/einnovator/pdattention
repo_name: einnovator/pdattention
edit_uri: edit/research/paper4-5-runtime/docs/site/

docs_dir: docs/site
site_dir: site
watch:
  - src

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - CLI: cli.md
  - Agents:
      - Overview: agents/index.md
      - PRA Agent: agents/pra-agent.md
      - DeepSeek Harness: agents/deepseek-harness.md
      - Pi Coding Agent: agents/pi-coding-agent.md
      - OpenHands: agents/openhands.md
      - Aider: agents/aider.md
      - Codex CLI: agents/codex-cli.md
      - Claude Code: agents/claude-code.md
  - Model Support: models.md
  - Web UI: web-ui.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Deployment:
      - Choose a Path: deployment/index.md
      - Gateway: deployment/gateway.md
      - Runtime / SDK: deployment/runtime-sdk.md
      - Engines: deployment/engines.md
  - Engines:
      - Overview: engines/overview.md
      - Hugging Face: engines/hugging-face.md
      - MLX: engines/mlx.md
      - vLLM: engines/vllm.md
      - SGLang: engines/sglang.md
      - OpenVINO: engines/openvino.md
      - TensorRT-LLM: engines/tensorrt-llm.md
      - AirLLM: engines/airllm.md
      - llama.cpp: engines/llama-cpp.md
      - Ollama: engines/ollama.md
      - FreeToken: engines/freetoken.md
  - Metrics & Qualification: metrics.md
  - Protocol: protocol.md
  - Storage: storage.md
  - API Reference:
      - Overview: api/index.md
      - Common Infrastructure: api/common.md
      - Reference Core: api/pra-core.md
      - Data Pipeline: api/data.md
      - Model and Attention: api/model.md
      - Memory and Resolution: api/memory.md
      - Training and Evaluation: api/training.md
      - Hugging Face Adapter: api/integrations.md
      - Agent SDK: api/agents.md
  - Research / Evidence: research/index.md

