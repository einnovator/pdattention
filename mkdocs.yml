site_name: Progressive Retrieval Attention
site_description: Architecture, usage, and Python API reference for the PRA research prototype
site_url: https://einnovator.github.io/pdattention/
use_directory_urls: false
repo_url: https://github.com/einnovator/pdattention
repo_name: einnovator/pdattention
edit_uri: edit/main/docs/site/

docs_dir: docs/site
site_dir: site
watch:
  - src

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Product CLI: cli.md
  - Agent Profiles and UI: agent-ui.md
  - Architecture: architecture.md
  - Execution and Deployment: deployment.md
  - API Reference:
      - Overview: api/index.md
      - Common Infrastructure: api/common.md
      - Reference Core: api/pra-core.md
      - Data Pipeline: api/data.md
      - Model and Attention: api/model.md
      - Memory and Resolution: api/memory.md
      - Training and Evaluation: api/training.md
      - Hugging Face Adapter: api/integrations.md
      - Agent SDK: api/agents.md

copyright: Copyright &copy; Progressive Retrieval Attention contributors
