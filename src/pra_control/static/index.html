<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eInnovator PRA Control Plane</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dockview-core@4.7.0/dist/styles/dockview.css" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
  <section id="login-screen" class="login-screen d-none" aria-labelledby="login-title">
    <form id="local-login" class="login-box">
      <div class="brand mb-3"><span class="brand-mark">PRA</span><strong id="login-title">Control Plane</strong></div>
      <p>Sign in to the fleet governance workspace.</p>
      <label class="form-label" for="login-user">Username</label><input id="login-user" class="form-control mb-2" autocomplete="username" required>
      <label class="form-label" for="login-password">Password</label><input id="login-password" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <button class="btn btn-success w-100" type="submit">Sign in</button>
      <div id="provider-logins" class="provider-logins"></div>
      <div id="login-error" class="text-danger small mt-2"></div>
    </form>
  </section>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">PRA</span><strong>Control Plane</strong></div>
    <div class="topbar-actions">
      <span id="connection-summary" class="status-dot" title="Fleet connection status"></span>
      <span id="identity-label">Connecting...</span>
      <button id="refresh-all" class="icon-button" title="Refresh all panels" aria-label="Refresh all panels"><i data-lucide="refresh-cw"></i></button>
      <button id="logout" class="icon-button" title="Sign out" aria-label="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>
  <main id="dockview" aria-label="PRA Control Plane workspace"></main>

  <template id="navigation-template">
    <section class="panel-body navigation-panel">
      <label class="filter-label" for="fleet-filter">Fleet</label>
      <div class="input-group input-group-sm mb-2"><span class="input-group-text"><i data-lucide="search"></i></span><input id="fleet-filter" class="form-control" placeholder="Filter engines"></div>
      <nav id="fleet-tree" class="tree-list" aria-label="Engine fleet"></nav>
      <div class="nav-separator"></div>
      <nav class="section-nav" aria-label="Control Plane sections">
        <button data-view="fleet"><i data-lucide="server"></i>Fleet overview</button>
        <button data-view="recommendations"><i data-lucide="lightbulb"></i>Recommendations</button>
        <div class="nav-caption">Registry</div>
        <button data-registry="models"><i data-lucide="box"></i>Models</button>
        <button data-registry="bundles"><i data-lucide="package"></i>PRA bundles</button>
        <button data-registry="profiles"><i data-lucide="sliders-horizontal"></i>Profiles</button>
        <button data-registry="qualifications"><i data-lucide="badge-check"></i>Qualifications</button>
        <button data-registry="compatibility"><i data-lucide="git-compare"></i>Compatibility</button>
        <button data-registry="deployments"><i data-lucide="ship"></i>Deployments</button>
        <button data-registry="instances"><i data-lucide="server"></i>Managed instances</button>
        <button data-registry="policies"><i data-lucide="shield-check"></i>Policies</button>
        <button data-registry="approvals"><i data-lucide="stamp"></i>Approvals</button>
      </nav>
    </section>
  </template>

  <template id="workspace-template">
    <section class="panel-body workspace-panel">
      <div class="workspace-heading">
        <div><h1 id="view-title">Fleet overview</h1><p id="view-subtitle">Observed engine state compared with Registry intent.</p></div>
        <div id="view-actions" class="toolbar"></div>
      </div>
      <div id="summary-strip" class="summary-strip"></div>
      <div id="workspace-content" class="table-responsive"></div>
    </section>
  </template>

  <template id="events-template">
    <section class="panel-body events-panel">
      <div class="compact-toolbar"><div class="segmented" role="tablist"><button class="active" data-event-view="audit">Audit</button><button data-event-view="alerts">Alerts</button></div><button id="refresh-events" class="icon-button" title="Refresh events"><i data-lucide="refresh-cw"></i></button></div>
      <div id="event-list" class="event-list"></div>
    </section>
  </template>

  <template id="agent-template">
    <section class="panel-body agent-panel">
      <div class="agent-status"><span id="agent-dot" class="status-dot"></span><span id="agent-status-label">Connecting</span><span class="ms-auto badge text-bg-light">RBAC governed</span></div>
      <div id="agent-messages" class="agent-messages" aria-live="polite"><div class="agent-empty">Ask about fleet health, drift, bundles, or observability.</div></div>
      <form id="agent-form" class="agent-composer"><textarea id="agent-input" rows="3" placeholder="Ask the PRA Agent..." required></textarea><button type="submit" class="icon-button primary" title="Send message" aria-label="Send message"><i data-lucide="send"></i></button></form>
    </section>
  </template>

  <div class="modal fade" id="action-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><form class="modal-content" id="action-form">
      <div class="modal-header"><h2 class="modal-title fs-6">Confirm engine action</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="action-description"></p><label class="form-label" for="action-reason">Reason</label><textarea class="form-control" id="action-reason" required></textarea><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="action-confirmed"><label class="form-check-label" for="action-confirmed">I confirm this high-impact operation</label></div></div>
      <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-danger">Run action</button></div>
    </form></div>
  </div>

  <div class="modal fade" id="registry-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><form class="modal-content" id="registry-form">
      <div class="modal-header"><h2 class="modal-title fs-6">Registry record</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><label class="form-label" for="registry-values">Record JSON</label><textarea class="form-control font-monospace" id="registry-values" rows="14" required>{}</textarea><label class="form-label mt-3" for="registry-reason">Reason</label><input class="form-control" id="registry-reason" required></div>
      <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-success">Submit</button></div>
    </form></div>
  </div>

  <div id="toast-stack" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dockview-core@4.7.0/dist/dockview-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/static/app.js?v=0.1.1"></script>
</body>
</html>
