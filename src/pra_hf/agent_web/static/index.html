<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRA Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dockview-core@4.7.0/dist/styles/dockview.css" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
  <header class="app-bar">
    <div class="brand"><i data-lucide="network"></i><strong>PRA Agent</strong></div>
    <div class="runtime-summary"><span id="connection" class="status-dot"></span><span id="profile-label">No session</span></div>
    <button id="new-session" class="btn btn-sm btn-light" title="New conversation"><i data-lucide="square-pen"></i></button>
  </header>
  <main id="dockview" aria-label="PRA agent workspace"></main>
  <template id="conversations-template">
    <section class="pane"><h2>Conversations</h2><div id="conversations" class="list-group list-group-flush"></div></section>
  </template>
  <template id="chat-template">
    <section class="pane chat-pane">
      <div id="messages" class="messages"></div>
      <form id="composer"><textarea id="prompt" rows="3" placeholder="Message PRA Agent" aria-label="Message"></textarea><button class="send" title="Send"><i data-lucide="send"></i></button></form>
    </section>
  </template>
  <template id="details-template">
    <section class="pane"><nav class="detail-tabs"><button data-tab="tasks">Tasks</button><button data-tab="context">Context</button><button data-tab="runtime">Runtime</button></nav><pre id="details">Select a conversation.</pre></section>
  </template>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dockview-core@4.7.0/dist/dockview-core.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
