    source_url: https://huggingface.co/TIGER-Lab/FIM-14B
    source_revision: c06455c0e18ae4991d5699a83f97b4edbfb21147
    published_score: 0.292
    published_total: 500
    benchmark: SWE-bench Verified
    dataset: R2E-Gym/SWE-Bench-Verified
    split: test
    harness: R2E-Gym
    harness_version: upstream-pinned-required
    model: TIGER-Lab/FIM-14B
    model_revision: c06455c0e18ae4991d5699a83f97b4edbfb21147
    tokenizer_revision: c06455c0e18ae4991d5699a83f97b4edbfb21147
    engine: vllm
    engine_version: pin-on-qualified-host
    dtype: bfloat16
    scaffold: r2egym
    context_limit: 65536
    max_steps: 40
    max_steps_absolute: 100
    temperature: 0
    function_calling: false
    prefix_caching: true
    tool_configuration: unmodified R2E-Gym Docker edit environment
    grading: official SWE-bench container harness
