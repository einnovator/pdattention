      - Published value is a three-seed mean; each local seed remains separately reported.
cells:
  - cell_id: fim14b-no-pra
    stage: B
    mode: native
    baseline_id: fim14b-r2egym-verified
    evidence_role: baseline_admission
    command:
      - python
      - -m
      - experiments.paper4_5_agent.runners.r2egym
      - --r2egym-root
      - /opt/R2E-Gym
      - --output
      - docs/papers/shared/results/paper4_5_runtime_productization/coding_agents/fim14b_r2egym_campaign
      - --base-url
      - http://127.0.0.1:8400/v1
      - --model
      - TIGER-Lab/FIM-14B
      - --served-model
      - FIM-14B
      - --run-id
      - fim14b-no-pra
      - --count
      - '500'
    timeout_seconds: 64800
    result:
      path: docs/papers/shared/results/paper4_5_runtime_productization/coding_agents/fim14b_r2egym_campaign/official_result.json
      absolute_tolerance: 0.05
      require_exact_cohort: true
    enabled: false
    notes:
      - Disabled until a BF16-capable vLLM host and pinned R2E-Gym checkout are recorded.
  - cell_id: fim14b-gateway-passthrough
    stage: C
    mode: gateway_passthrough
    baseline_id: fim14b-r2egym-verified
    evidence_role: transport_qualification
    baseline_cell: fim14b-no-pra
    command: [python, -c, "raise SystemExit('gateway runner is locked until baseline reproduction')"]
    timeout_seconds: 64800
    result:
      path: docs/papers/shared/results/paper4_5_runtime_productization/coding_agents/fim14b_r2egym_campaign/gateway_result.json
    enabled: false
  - cell_id: fim14b-gateway-pra-balanced
    stage: C
    mode: gateway_pra
    baseline_id: fim14b-r2egym-verified
    evidence_role: efficacy
    baseline_cell: fim14b-no-pra
    command: [python, -c, "raise SystemExit('PRA runner is locked until baseline reproduction')"]
    timeout_seconds: 64800
    result:
      path: docs/papers/shared/results/paper4_5_runtime_productization/coding_agents/fim14b_r2egym_campaign/pra_result.json
    enabled: false
