control_plane:
  host: 0.0.0.0
  port: 9300
  public_url: http://127.0.0.1:9300
  database_url: postgresql+psycopg://pra:${POSTGRES_PASSWORD}@postgres/pra
  auth:
    cookie_secret_env: PRA_CONTROL_COOKIE_SECRET
    cookie_secure: false
    allow_local_auth_non_loopback: true
    providers:
      - name: local
        kind: local
  manager:
    backend_mode: direct
    audit: true
  agent:
    # The Web UI can use any reachable OpenAI-compatible inference endpoint.
    engine: mlx-lab
    model: qwen-4b
    model_enabled: true
    api_key_env: PRA_CONTROL_AGENT_API_KEY
    request_timeout_seconds: 60
    max_tokens: 512
    temperature: 0.1
  rest:
    enabled: true
    allow: ["*"]
    deny: []
  mcp:
    enabled: false
    transports:
      http:
        enabled: false
        path: /mcp
        host: 127.0.0.1
        port: 9301
        auth_profile: mcp-remote
      stdio:
        enabled: false
        auth_profile: mcp-local
    tools:
      allow: [pra_fleet, pra_engine, pra_gateway, pra_catalog, pra_qualification, pra_deployment, pra_metrics, pra_context, pra_plan]
      deny: [pra_apply, pra_experiment]
  auth_profiles:
    mcp-local:
      type: service_identity
      subject: local-coding-agent
      roles: [Viewer]
    mcp-remote:
      type: bearer_token
      subject: remote-coding-agent
      roles: [Viewer]
      token_env: PRA_CONTROL_MCP_TOKEN
registry:
  url: http://pra-registry:9200
  token_env: PRA_REGISTRY_TOKEN
fleet:
  discovery_mode: combined
  engines:
    - name: mlx-lab
      management_url: http://host.docker.internal:9101
      inference_url: http://host.docker.internal:8000
      environment: development
      cluster: mac-lab
grafana:
  url: http://127.0.0.1:3000
tempo:
  url: http://127.0.0.1:3200
prometheus:
  url: http://127.0.0.1:9090
