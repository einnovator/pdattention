registry:
  host: 0.0.0.0
  port: 9200
  database_url: postgresql+psycopg://pra:pra@postgres:5432/pra_registry
  auth:
    mode: static_token
    static_token_env: PRA_REGISTRY_TOKEN
  observability:
    enabled: false
    prometheus_enabled: false
    otel_enabled: false
  instance_registration:
    offline_after_seconds: 90
    allowed_environments: []
    allowed_clusters: []
    allowed_identities: []
