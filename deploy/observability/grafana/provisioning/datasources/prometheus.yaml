apiVersion: 1
datasources:
  - name: Prometheus
    uid: pra-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: pra-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # This lab exposes Tempo over ordinary HTTP. Disable Grafana's optional
      # streaming search transport, which requires a gRPC-capable gateway.
      streamingEnabled:
        search: false
        metrics: false
      tracesToMetrics:
        datasourceUid: pra-prometheus
      serviceMap:
        datasourceUid: pra-prometheus
      nodeGraph:
        enabled: true
