global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pra-engines
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
        refresh_interval: 15s
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
