global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pra-runtime
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:9464]
        labels:
          service: pra-runtime
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
