[project]
name = "pra-hf"
version = "0.2.0rc1"
description = "Bounded sparse native-KV memory for Hugging Face causal language models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "click>=8.1",
  "PyYAML>=6.0",
  "packaging>=23",
  "numpy>=1.24",
  "transformers>=4.45",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
hf-hub = [
  "huggingface-hub>=0.26",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psutil>=5.9",
]
management-auth = [
  "PyJWT[crypto]>=2.9",
]
observability = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "prometheus-client>=0.21",
]
registry = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "PyJWT[crypto]>=2.9",
  "huggingface-hub>=0.26",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
]
control-plane = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.12",
  "PyJWT[crypto]>=2.9",
]
control-plane-saml = [
  "python3-saml>=1.16",
]
hf-runtime = [
  "transformers>=4.45",
  "accelerate>=0.33",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.29",
]
research = [
  "accelerate>=0.33",
  "datasets>=3.0",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "peft>=0.12",
  "pytest>=8.0",
  "tqdm>=4.66",
]

[project.scripts]
pra = "pra_hf.cli:cli"
pra-hf = "pra_hf.cli:deprecated_cli"
pra-standalone = "pra_torch.cli:cli"
pra-registry = "pra_registry.cli:main"
pra-control = "pra_control.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: subprocess-level product workflows requiring explicit PRA_RUN_CLI_E2E=1",
]

[tool.setuptools.package-data]
pra_hf = ["model_profiles/*.json", "model_profiles/*.yaml"]
pra_registry = ["migrations/script.py.mako"]
pra_control = ["static/*.html", "static/*.css", "static/*.js", "static/help/*.md"]
